<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Title -->
    <title>Perscripto | Book Doctor Appointments Online</title>

    <!-- Meta Description -->
    <meta
      name="description"
      content="Perscripto is an online doctor appointment platform that allows patients to book, manage, and track medical appointments easily and securely."
    />

    <!-- Keywords (optional but useful) -->
    <meta
      name="keywords"
      content="doctor appointment, book doctor online, medical appointment system, healthcare platform, MERN stack app"
    />

    <!-- Author -->
    <meta name="author" content="Perscripto" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta
      property="og:title"
      content="Perscripto | Book Doctor Appointments Online"
    />
    <meta
      property="og:description"
      content="Book doctor appointments online, manage schedules, and access healthcare services easily with Perscripto."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://appointment-frontend-system.onrender.com"
    />
    <meta
      property="og:image"
      content="https://appointment-frontend-system.onrender.com/cover.png"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Perscripto | Doctor Appointment Platform"
    />
    <meta
      name="twitter:description"
      content="An online healthcare platform to book and manage doctor appointments effortlessly."
    />
    <meta
      name="twitter:image"
      content="https://appointment-frontend-system.onrender.com/cover.png"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
